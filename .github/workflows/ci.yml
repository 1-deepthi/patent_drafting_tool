# CI — lint, test, cross-OS matrix
#
# What runs on every push + pull request:
#   1. backend   (ubuntu/windows/macos × Python 3.11/3.13): install, compile, import smoke
#   2. backend-legacy-suite (ubuntu only, Postgres service, advisory): tracks the
#      archived SQL test suite during the Firebase migration — allowed to fail.
#   3. frontend  (ubuntu/windows/macos × Node 20): npm ci, lint (advisory until
#      eslint is configured), tsc + vite build
#   4. docs-health (ubuntu): required community-health files present, no secrets staged
#
# Branch protection should require: backend, frontend, docs-health.
# backend-legacy-suite and lint steps are advisory (continue-on-error) and must
# NOT be required — see inline comments.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- backend --
  backend:
    name: backend / py${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check (all app modules)
        run: python -m compileall -q app

      - name: Import smoke (no credentials needed)
        run: python -c "import app.main; print('app.main imports OK:', app.main.app.title)"

      - name: Dependency consistency
        run: pip check

  # --------------------------------------- backend legacy suite (advisory) --
  # The tests/ directory targets the archived Postgres/SQLAlchemy API
  # (dev-login, TRUNCATE fixtures) which is not mounted by app/main.py, and
  # its test-only dependencies (pytest-asyncio, sqlalchemy, asyncpg) are
  # intentionally absent from requirements.txt. Running pytest unconditionally
  # therefore dies in conftest import (exit code 4) — noise, not signal.
  # This job tracks migration debt without blocking merges: it probes for the
  # legacy prerequisites and quarantines (skips with a visible notice) when
  # they are absent. When migration work restores the Firebase-path suite and
  # its deps, the gate flips and the suite runs for real.
  # It is intentionally continue-on-error until then.
  # DO NOT add this job to required branch-protection checks.
  backend-legacy-suite:
    name: backend-legacy-suite / ubuntu (advisory, allowed to fail)
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: patent_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check legacy suite prerequisites
        id: legacy-check
        run: |
          if python -c "import pytest_asyncio" 2>/dev/null; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Legacy SQL test suite is quarantined: its test-only dependencies (pytest-asyncio and friends) are not installed and tests/ targets the unmounted legacy API. See CHANGELOG.md Known gaps. Skipping collection instead of failing it."
          fi

      - name: Run legacy test suite (only when its prerequisites exist)
        if: steps.legacy-check.outputs.ready == 'true'
        run: python -m pytest -q

  # --------------------------------------------------------------- frontend --
  frontend:
    name: frontend / node20 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # No eslint config/deps are committed yet (package.json has a lint
      # script but eslint is not in devDependencies), so this stays advisory
      # until the eslint setup lands. DO NOT require it in branch protection.
      - name: Lint (advisory until eslint is configured)
        run: npm run lint --if-present
        continue-on-error: true

      - name: Type-check + build
        run: npm run build

      - name: Upload dist artifact (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ------------------------------------------------------------ docs-health --
  docs-health:
    name: docs-health / ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required community-health files present
        run: |
          for f in README.md LICENSE CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md ACCESSIBILITY.md SUPPORT.md CHANGELOG.md .github/PULL_REQUEST_TEMPLATE.md .github/CODEOWNERS .github/dependabot.yml; do
            test -f "$f" || { echo "MISSING: $f"; exit 1; }
          done
          test -f docs/GETTING_STARTED.md
          test -f docs/ARCHITECTURE.md
          test -f docs/API_OVERVIEW.md
          test -f docs/DEVELOPMENT.md
          test -f docs/DOCKER.md
          echo "All required docs present."

      - name: No secrets or env files staged
        run: |
          git status --short | tee /tmp/status.txt
          if grep -Eq '(\.env$|secrets/|firebase-service-account\.json|\.pem$|\.key$)' /tmp/status.txt; then
            echo "ERROR: secret-looking files in working tree — see SECURITY.md."; exit 1;
          fi
          echo "No secret-looking files found."
