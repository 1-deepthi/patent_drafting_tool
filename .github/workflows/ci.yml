# CI — lint, test, cross-OS matrix
#
# What runs on every push + pull request:
#   1. backend   (ubuntu/windows/macos × Python 3.11/3.13): install, compile,
#      import smoke, offline pytest suite (no Firebase credentials needed)
#   2. frontend  (ubuntu/windows/macos × Node 20): npm ci, lint (advisory until
#      eslint is configured), tsc + vite build
#   3. docs-health (ubuntu): required community-health files present, no secrets staged
#
# Branch protection should require: backend, frontend, docs-health.
# The lint step is advisory (continue-on-error) and must NOT be required —
# see the inline comment.
#
# There is no Postgres service and no legacy SQL suite any more: Firebase is
# the only system of record (ADR-005).

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- backend --
  backend:
    name: backend / py${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check (all app modules)
        run: python -m compileall -q app

      - name: Import smoke (no credentials needed)
        run: python -c "import app.main; print('app.main imports OK:', app.main.app.title)"

      # Offline suite: forces empty Firebase config, so it asserts boot,
      # the mounted API contract, and the pure-Python services (RBAC catalog,
      # stub drafts, DOCX rendering). It never reaches Auth/Firestore/Storage.
      - name: Offline test suite
        run: python -m pytest

      - name: Dependency consistency
        run: pip check

  # --------------------------------------------------------------- frontend --
  frontend:
    name: frontend / node20 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # No eslint config/deps are committed yet (package.json has a lint
      # script but eslint is not in devDependencies), so this stays advisory
      # until the eslint setup lands. DO NOT require it in branch protection.
      - name: Lint (advisory until eslint is configured)
        run: npm run lint --if-present
        continue-on-error: true

      # Vite inlines VITE_* at build time; empty values are fine because
      # src/lib/firebase.ts reports a configuration error at runtime instead
      # of failing the build.
      - name: Type-check + build
        run: npm run build

      - name: Upload dist artifact (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ------------------------------------------------------------ docs-health --
  docs-health:
    name: docs-health / ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required community-health files present
        run: |
          for f in README.md LICENSE CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md ACCESSIBILITY.md SUPPORT.md CHANGELOG.md .github/PULL_REQUEST_TEMPLATE.md .github/CODEOWNERS .github/dependabot.yml; do
            test -f "$f" || { echo "MISSING: $f"; exit 1; }
          done
          test -f docs/GETTING_STARTED.md
          test -f docs/ARCHITECTURE.md
          test -f docs/API_OVERVIEW.md
          test -f docs/DEVELOPMENT.md
          test -f docs/DOCKER.md
          test -f docs/decisions/ADR-005-firestore-only-runtime.md
          echo "All required docs present."

      - name: No stale SQL/Postgres references in the shipped code
        run: |
          # Markdown is excluded on purpose: the ADRs and CHANGELOG document the
          # history of the migration (ADR-001 → ADR-005) and must be able to
          # name Postgres/SQLAlchemy.
          if grep -RIn --exclude-dir=.git --exclude-dir=.github --exclude-dir=node_modules --exclude-dir=ref-repos \
               --exclude-dir=dist --include='*.py' --include='*.txt' --include='*.toml' \
               --include='*.ini' --include='*.yml' --include='*.yaml' --include='Dockerfile' \
               -E 'sqlalchemy|asyncpg|alembic|DATABASE_URL|psycopg' .; then
            echo "ERROR: legacy SQL references found — see ADR-005."; exit 1
          fi
          echo "No legacy SQL references found."

      - name: No secrets or env files staged
        run: |
          git status --short | tee /tmp/status.txt
          if grep -Eq '(\.env$|secrets/|firebase-service-account\.json|\.pem$|\.key$)' /tmp/status.txt; then
            echo "ERROR: secret-looking files in working tree — see SECURITY.md."; exit 1;
          fi
          echo "No secret-looking files found."
