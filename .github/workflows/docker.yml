# Docker — build backend + frontend images, smoke-test them.
#
# Runs on push to main + PRs. Pushes to GHCR only on main (and only if the
# build + smoke steps pass). No secrets are baked into either image.

name: Docker

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build + smoke / ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-action@v6
        with:
          context: ./backend
          tags: patent-backend:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-action@v6
        with:
          context: ./frontend
          build-args: VITE_API_URL=http://localhost:8000
          tags: patent-frontend:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Backend has no Firebase credentials in CI, so /health is expected to
      # answer 503 (degraded) — what we assert is that the container boots
      # and serves HTTP, not that Firebase is reachable.
      - name: Smoke-test backend container
        run: |
          docker run -d --name backend-ci -p 8000:8000 \
            -e FIREBASE_PROJECT_ID=ci-placeholder \
            -e BOOTSTRAP_ADMIN_EMAIL=ci@example.com \
            patent-backend:ci
          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || true)
            if [ "$code" = "200" ] || [ "$code" = "503" ]; then
              echo "backend /health answered HTTP $code — container is serving."
              docker rm -f backend-ci
              exit 0
            fi
            sleep 5
          done
          echo "backend never served /health"; docker logs backend-ci; docker rm -f backend-ci; exit 1

      - name: Smoke-test frontend container
        run: |
          docker run -d --name frontend-ci -p 8080:80 patent-frontend:ci
          sleep 5
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/ || true)
          docker rm -f frontend-ci
          if [ "$code" = "200" ]; then echo "frontend served HTTP 200."; exit 0; fi
          echo "frontend answered HTTP $code"; exit 1

      - name: Tag + push to GHCR (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker tag patent-backend:ci ghcr.io/$owner/patent_drafting_tool-backend:latest
          docker tag patent-frontend:ci ghcr.io/$owner/patent_drafting_tool-frontend:latest
          docker push ghcr.io/$owner/patent_drafting_tool-backend:latest
          docker push ghcr.io/$owner/patent_drafting_tool-frontend:latest
