# Phase 10 — nginx config for the production frontend container (see
# frontend/Dockerfile). Two jobs: serve the Vite build as static files,
# and fall back every unknown path to index.html so React Router's
# client-side routes (e.g. /innovator/patents/42) work on a hard refresh
# instead of 404ing at the web server before React ever loads.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Mirrors the backend's SecurityHeadersMiddleware (backend/app/core/headers.py)
    # — same headers, same reasoning, applied at the edge for static assets
    # the backend never touches.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;

    location = /health {
        default_type text/plain;
        return 200 "ok";
    }

    # Cache hashed build assets aggressively — Vite fingerprints filenames,
    # so a new deploy always ships new filenames rather than reusing one a
    # client might have cached.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
