# Phase 10 — nginx config for the production frontend container (see
# frontend/Dockerfile). Two jobs: serve the Vite build as static files,
# and fall back every unknown path to index.html so React Router's
# client-side routes (e.g. /innovator/patents/42) work on a hard refresh
# instead of 404ing at the web server before React ever loads.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Mirrors the backend's SecurityHeadersMiddleware (backend/app/core/headers.py)
    # — same headers, same reasoning, applied at the edge for static assets
    # the backend never touches.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # CSP for a Vite SPA: scripts are external hashed bundles, styles come
    # from the Tailwind stylesheet plus React inline style attributes, and
    # Firebase Auth needs its identity/token endpoints. `connect-src https:`
    # keeps the API host configurable at build time (VITE_API_URL).
    # The Google popup flow loads its loader from apis.google.com and renders
    # the auth iframe on the project's firebaseapp.com domain; without both
    # allowances the production build blocks Google sign-in. If
    # VITE_FIREBASE_AUTH_DOMAIN is a custom domain, add it to frame-src too.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-src 'self' https://*.firebaseapp.com https://accounts.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    # Ignored over plain HTTP; protects the container when it is served
    # behind a TLS-terminating proxy or ingress.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;

    location = /health {
        default_type text/plain;
        return 200 "ok";
    }

    # Cache hashed build assets aggressively — Vite fingerprints filenames,
    # so a new deploy always ships new filenames rather than reusing one a
    # client might have cached.
    # nginx does not inherit `add_header` into a location that defines its
    # own, so the security headers are repeated here alongside the cache
    # header rather than silently disappearing on hashed assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-src 'self' https://*.firebaseapp.com https://accounts.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
